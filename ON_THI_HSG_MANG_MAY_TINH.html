{"t": "Máy có địa chỉ 169.254.x.x chứng tỏ đã lấy IP từ DHCP thành công.", "a": false, "e": "Ngược lại, chưa nhận được IP từ DHCP."}], "img": ""}]}, {"name": "LEVEL 3: Nâng cao HSG — Phân tầng, DHCP/NAT/DNS, IP & mạng con, Bảo mật, Sự cố", "gn": [{"t": "7. ⭐ Mô hình phân tầng và đóng gói dữ liệu", "h": "<p>Mạng được chia thành nhiều <strong>tầng<\/strong>, mỗi tầng đảm nhiệm một nhiệm vụ riêng và chỉ giao tiếp với tầng kề nó. Nhờ vậy có thể thay đổi công nghệ ở một tầng (ví dụ đổi từ cáp sang Wi-Fi) mà không phải sửa các tầng khác.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:700px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m8\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Tầng<\/text><text x=\"325.0\" y=\"16.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Giao thức<\/text><text x=\"575.0\" y=\"16.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Thiết bị<\/text><rect x=\"10\" y=\"24\" width=\"180\" height=\"48\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"100.0\" y=\"52.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">4. Ứng dụng<\/text><rect x=\"200\" y=\"24\" width=\"250\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"325.0\" y=\"52.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">HTTP, DNS, SMTP, DHCP<\/text><rect x=\"460\" y=\"24\" width=\"230\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"575.0\" y=\"52.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Trình duyệt, ứng dụng mạng<\/text><rect x=\"10\" y=\"82\" width=\"180\" height=\"48\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"100.0\" y=\"110.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">3. Giao vận<\/text><rect x=\"200\" y=\"82\" width=\"250\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"325.0\" y=\"110.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">TCP, UDP<\/text><rect x=\"10\" y=\"140\" width=\"180\" height=\"48\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"100.0\" y=\"168.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">2. Internet<\/text><rect x=\"200\" y=\"140\" width=\"250\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"325.0\" y=\"168.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">IP, ICMP<\/text><rect x=\"460\" y=\"140\" width=\"230\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"575.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Router (tầng 3)<\/text><rect x=\"10\" y=\"198\" width=\"180\" height=\"48\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#475569\"/><text x=\"100.0\" y=\"226.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">1. Truy cập mạng<\/text><rect x=\"200\" y=\"198\" width=\"250\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"325.0\" y=\"226.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">Ethernet, Wi-Fi<\/text><rect x=\"460\" y=\"198\" width=\"230\" height=\"48\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"575.0\" y=\"218.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Switch (tầng 2)<\/text><text x=\"575.0\" y=\"233.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Hub, repeater (tầng 1)<\/text><\/svg><\/span><\/p><p><em>Hình 13. Bốn tầng của bộ giao thức TCP/IP, giao thức và thiết bị tương ứng<\/em><\/p><p>Khi gửi dữ liệu, mỗi tầng thêm <strong>tiêu đề (header)<\/strong> chứa thông tin điều khiển của tầng đó; máy nhận bóc dần các tiêu đề theo thứ tự ngược lại.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 720 255\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:720px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m9\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><text x=\"10.0\" y=\"15.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#475569\">Gửi đi: mỗi tầng thêm tiêu đề (header) ↓<\/text><rect x=\"300\" y=\"26\" width=\"200\" height=\"36\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"400.0\" y=\"48.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">Dữ liệu<\/text><text x=\"575.0\" y=\"48.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Dữ liệu ứng dụng<\/text><line x1=\"400\" y1=\"62\" x2=\"400\" y2=\"88\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m9)\"/><rect x=\"300\" y=\"88\" width=\"200\" height=\"36\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"400.0\" y=\"110.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">Dữ liệu<\/text><rect x=\"240\" y=\"88\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"270.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">TCP<\/text><text x=\"575.0\" y=\"110.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Đoạn (segment)<\/text><line x1=\"400\" y1=\"124\" x2=\"400\" y2=\"150\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m9)\"/><rect x=\"300\" y=\"150\" width=\"200\" height=\"36\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"400.0\" y=\"172.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">Dữ liệu<\/text><rect x=\"240\" y=\"150\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"270.0\" y=\"172.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">TCP<\/text><rect x=\"180\" y=\"150\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"210.0\" y=\"172.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">IP<\/text><text x=\"575.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Gói (packet)<\/text><line x1=\"400\" y1=\"186\" x2=\"400\" y2=\"212\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m9)\"/><rect x=\"300\" y=\"212\" width=\"200\" height=\"36\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"400.0\" y=\"234.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\">Dữ liệu<\/text><rect x=\"240\" y=\"212\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"270.0\" y=\"234.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">TCP<\/text><rect x=\"180\" y=\"212\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"210.0\" y=\"234.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">IP<\/text><rect x=\"120\" y=\"212\" width=\"60\" height=\"36\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#475569\"/><text x=\"150.0\" y=\"234.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Eth<\/text><rect x=\"500\" y=\"212\" width=\"50\" height=\"36\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#475569\"/><text x=\"525.0\" y=\"233.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\" font-weight=\"700\">FCS<\/text><text x=\"575.0\" y=\"234.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Khung (frame)<\/text><\/svg><\/span><\/p><p><em>Hình 14. Quá trình đóng gói dữ liệu qua các tầng<\/em><\/p><p><strong>Nguyên tắc quan trọng khi gói tin đi qua nhiều router:<\/strong><\/p><ul>\n<li><p><strong>Địa chỉ IP nguồn và IP đích giữ nguyên<\/strong> trong suốt hành trình (trừ khi có NAT).<\/p><\/li>\n<li><p><strong>Địa chỉ MAC thay đổi ở mỗi chặng<\/strong>: mỗi lần chuyển từ thiết bị này sang thiết bị kế tiếp, MAC nguồn và MAC đích được thay bằng MAC của hai thiết bị đầu và cuối chặng đó.<\/p><\/li>\n<li><p><strong>ARP<\/strong> là giao thức tìm địa chỉ MAC khi biết địa chỉ IP trong cùng một LAN. Khi đích ngoài LAN, máy gửi hỏi MAC của <strong>gateway<\/strong>.<\/p><\/li>\n<li><p><strong>TTL (Time To Live):<\/strong> mỗi router đi qua làm TTL giảm 1; về 0 thì gói tin bị hủy, tránh lặp vô hạn. Lệnh tracert dựa vào cơ chế này để liệt kê các router.<\/p><\/li>\n<\/ul><p><strong>Hành trình khi gõ moet.gov.vn vào trình duyệt:<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Bước<\/strong><\/th>\n<th><strong>Điều xảy ra<\/strong><\/th>\n<th><strong>Giao thức<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>1<\/td>\n<td>Trình duyệt hỏi máy chủ DNS để đổi tên miền thành địa chỉ IP<\/td>\n<td>DNS (UDP, cổng 53)<\/td>\n<\/tr><tr class=\"header\">\n<td>2<\/td>\n<td>Máy gửi gói tin tới gateway (vì IP đích ngoài LAN), dùng ARP để biết MAC của gateway<\/td>\n<td>ARP, Ethernet/Wi-Fi<\/td>\n<\/tr><tr class=\"odd\">\n<td>3<\/td>\n<td>Thiết lập kết nối với máy chủ web (bắt tay 3 bước: SYN, SYN-ACK, ACK)<\/td>\n<td>TCP<\/td>\n<\/tr><tr class=\"header\">\n<td>4<\/td>\n<td>Gửi yêu cầu lấy trang web; máy chủ trả về nội dung (HTML, ảnh...)<\/td>\n<td>HTTP hoặc HTTPS<\/td>\n<\/tr><tr class=\"odd\">\n<td>5<\/td>\n<td>Router các chặng dùng bảng định tuyến chuyển gói tin tới đích<\/td>\n<td>IP<\/td>\n<\/tr><\/tbody><\/table><\/div>"}, {"t": "8. ⭐ Các dịch vụ nền tảng: DHCP, NAT, DNS, thư điện tử, web", "h": "<p><strong>a) DHCP<\/strong> tự động cấp cấu hình mạng cho máy khách để người dùng không phải gõ tay. Địa chỉ được <strong>thuê<\/strong> trong một khoảng thời gian rồi tự gia hạn hoặc thu hồi.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 520 275\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:520px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m10\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><rect x=\"30\" y=\"10\" width=\"120\" height=\"32\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"90.0\" y=\"30.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">Máy khách<\/text><rect x=\"370\" y=\"10\" width=\"120\" height=\"32\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"430.0\" y=\"30.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">Máy chủ DHCP<\/text><line x1=\"90\" y1=\"42\" x2=\"90\" y2=\"262\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"430\" y1=\"42\" x2=\"430\" y2=\"262\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"90\" y1=\"85\" x2=\"430\" y2=\"85\" stroke=\"#2563eb\" stroke-width=\"2\" marker-end=\"url(#m10)\"/><text x=\"260.0\" y=\"80.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2563eb\">1. Discover: tìm máy chủ DHCP (quảng bá)<\/text><line x1=\"430\" y1=\"137\" x2=\"90\" y2=\"137\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m10)\"/><text x=\"260.0\" y=\"132.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#16a34a\">2. Offer: đề nghị địa chỉ IP<\/text><line x1=\"90\" y1=\"189\" x2=\"430\" y2=\"189\" stroke=\"#2563eb\" stroke-width=\"2\" marker-end=\"url(#m10)\"/><text x=\"260.0\" y=\"184.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2563eb\">3. Request: xin dùng địa chỉ đó<\/text><line x1=\"430\" y1=\"241\" x2=\"90\" y2=\"241\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m10)\"/><text x=\"260.0\" y=\"236.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#16a34a\">4. ACK: xác nhận + mask, gateway, DNS<\/text><\/svg><\/span><\/p><p><em>Hình 15. Bốn bước cấp địa chỉ IP của DHCP (Discover, Offer, Request, ACK)<\/em><\/p><ul>\n<li><p>Thông tin DHCP cấp: địa chỉ IP, subnet mask, gateway mặc định, máy chủ DNS.<\/p><\/li>\n<li><p>Nếu máy không liên lạc được máy chủ DHCP, Windows tự gán địa chỉ dạng <strong>169.254.x.x<\/strong>; thấy địa chỉ này nghĩa là máy <strong>chưa nhận được IP<\/strong> từ DHCP.<\/p><\/li>\n<li><p>Hai máy trùng địa chỉ IP trong cùng LAN gây xung đột địa chỉ, một hoặc cả hai máy mất kết nối.<\/p><\/li>\n<\/ul><p><strong>b) NAT (chuyển đổi địa chỉ mạng)<\/strong> do router thực hiện: đổi IP riêng của các máy trong LAN thành IP công cộng khi ra Internet.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 700 255\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:700px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m11\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><rect x=\"10\" y=\"15\" width=\"150\" height=\"46\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"85.0\" y=\"34.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Máy 1<\/text><text x=\"85.0\" y=\"49.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">192.168.1.10<\/text><line x1=\"160\" y1=\"38\" x2=\"265\" y2=\"105\" stroke=\"#2563eb\" stroke-width=\"2\" marker-end=\"url(#m11)\"/><rect x=\"10\" y=\"90\" width=\"150\" height=\"46\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"85.0\" y=\"109.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Máy 2<\/text><text x=\"85.0\" y=\"124.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">192.168.1.11<\/text><line x1=\"160\" y1=\"113\" x2=\"265\" y2=\"125\" stroke=\"#2563eb\" stroke-width=\"2\" marker-end=\"url(#m11)\"/><rect x=\"10\" y=\"165\" width=\"150\" height=\"46\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"85.0\" y=\"184.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Máy 3<\/text><text x=\"85.0\" y=\"199.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">192.168.1.12<\/text><line x1=\"160\" y1=\"188\" x2=\"265\" y2=\"145\" stroke=\"#2563eb\" stroke-width=\"2\" marker-end=\"url(#m11)\"/><rect x=\"265\" y=\"80\" width=\"160\" height=\"90\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"345.0\" y=\"114.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Router (NAT)<\/text><text x=\"345.0\" y=\"129.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">trong: 192.168.1.1<\/text><text x=\"345.0\" y=\"144.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">ngoài: 203.0.113.5<\/text><line x1=\"425\" y1=\"125\" x2=\"560\" y2=\"125\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m11)\"/><text x=\"492.5\" y=\"113.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">cùng IP công cộng<\/text><text x=\"492.5\" y=\"127.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">203.0.113.5<\/text><rect x=\"560\" y=\"100\" width=\"120\" height=\"50\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#475569\"/><text x=\"620.0\" y=\"129.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">Internet<\/text><text x=\"350.0\" y=\"244.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">NAT đổi IP riêng → IP công cộng và ghi nhớ để trả dữ liệu về đúng máy<\/text><\/svg><\/span><\/p><p><em>Hình 16. NAT: nhiều máy trong LAN dùng chung một địa chỉ IP công cộng<\/em><\/p><ul>\n<li><p>Tiết kiệm địa chỉ IPv4 công cộng (đang khan hiếm), che giấu cấu trúc mạng nội bộ.<\/p><\/li>\n<li><p>Máy từ ngoài Internet không tự ý truy cập vào máy trong LAN được, trừ khi cấu hình chuyển tiếp cổng (port forwarding).<\/p><\/li>\n<\/ul><p><strong>c) DNS<\/strong> là hệ thống phân cấp: Root → tên miền cấp cao (.vn, .com) → tên miền cụ thể. Tên miền .vn do Trung tâm Internet Việt Nam (VNNIC) quản lí.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 700 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:700px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m12\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><rect x=\"10\" y=\"40\" width=\"118\" height=\"50\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"69.0\" y=\"61.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">Máy tính<\/text><text x=\"69.0\" y=\"75.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">cần moet.gov.vn<\/text><line x1=\"128\" y1=\"65\" x2=\"148\" y2=\"65\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m12)\"/><rect x=\"148\" y=\"40\" width=\"118\" height=\"50\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"207.0\" y=\"61.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">DNS cục bộ<\/text><text x=\"207.0\" y=\"75.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">(nhà mạng)<\/text><line x1=\"266\" y1=\"65\" x2=\"286\" y2=\"65\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m12)\"/><rect x=\"286\" y=\"40\" width=\"118\" height=\"50\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"345.0\" y=\"61.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">Máy chủ gốc<\/text><text x=\"345.0\" y=\"75.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">(Root)<\/text><line x1=\"404\" y1=\"65\" x2=\"424\" y2=\"65\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m12)\"/><rect x=\"424\" y=\"40\" width=\"118\" height=\"50\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#475569\"/><text x=\"483.0\" y=\"68.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">Máy chủ .vn<\/text><line x1=\"542\" y1=\"65\" x2=\"562\" y2=\"65\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#m12)\"/><rect x=\"562\" y=\"40\" width=\"118\" height=\"50\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"621.0\" y=\"61.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">Máy chủ gov.vn<\/text><text x=\"621.0\" y=\"75.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0f172a\">(biết moet.gov.vn)<\/text><line x1=\"640\" y1=\"90\" x2=\"640\" y2=\"150\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"640\" y1=\"150\" x2=\"70\" y2=\"150\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-dasharray=\"5 4\" marker-end=\"url(#m12)\"/><text x=\"355.0\" y=\"145.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#16a34a\">địa chỉ IP của moet.gov.vn được trả về<\/text><line x1=\"70\" y1=\"150\" x2=\"70\" y2=\"92\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-dasharray=\"5 4\" marker-end=\"url(#m12)\"/><text x=\"350.0\" y=\"19.3\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0f172a\" font-weight=\"700\">Phân giải tên miền: hỏi lần lượt từ gốc → .vn → gov.vn<\/text><text x=\"350.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">DNS là hệ thống phân cấp: Root → .vn → gov.vn → moet.gov.vn<\/text><\/svg><\/span><\/p><p><em>Hình 17. Quá trình tra cứu tên miền moet.gov.vn<\/em><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Bản ghi DNS<\/strong><\/th>\n<th><strong>Ý nghĩa<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>A<\/td>\n<td>Tên miền → địa chỉ IPv4<\/td>\n<\/tr><tr class=\"header\">\n<td>AAAA<\/td>\n<td>Tên miền → địa chỉ IPv6<\/td>\n<\/tr><tr class=\"odd\">\n<td>MX<\/td>\n<td>Máy chủ nhận thư của tên miền<\/td>\n<\/tr><tr class=\"header\">\n<td>CNAME<\/td>\n<td>Bí danh trỏ sang một tên miền khác<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>d) Thư điện tử:<\/strong> người gửi dùng <strong>SMTP<\/strong> đẩy thư lên máy chủ thư của mình; các máy chủ thư chuyển thư cho nhau bằng SMTP; người nhận dùng <strong>POP3<\/strong> (tải thư về máy) hoặc <strong>IMAP<\/strong> (xem thư trên máy chủ, đồng bộ nhiều thiết bị).<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 700 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:700px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m13\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><rect x=\"10\" y=\"40\" width=\"125\" height=\"60\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"72.5\" y=\"66.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Người gửi<\/text><text x=\"72.5\" y=\"81.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">(phần mềm thư)<\/text><line x1=\"135\" y1=\"70\" x2=\"195\" y2=\"70\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m13)\"/><text x=\"165.0\" y=\"65.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">SMTP<\/text><rect x=\"195\" y=\"40\" width=\"125\" height=\"60\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"257.5\" y=\"66.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Máy chủ thư<\/text><text x=\"257.5\" y=\"81.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">bên gửi<\/text><line x1=\"320\" y1=\"70\" x2=\"380\" y2=\"70\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m13)\"/><text x=\"350.0\" y=\"65.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">SMTP<\/text><rect x=\"380\" y=\"40\" width=\"125\" height=\"60\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#475569\"/><text x=\"442.5\" y=\"66.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Máy chủ thư<\/text><text x=\"442.5\" y=\"81.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">bên nhận<\/text><line x1=\"505\" y1=\"70\" x2=\"565\" y2=\"70\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m13)\"/><text x=\"535.0\" y=\"65.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#16a34a\">POP3 / IMAP<\/text><rect x=\"565\" y=\"40\" width=\"125\" height=\"60\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"627.5\" y=\"66.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Người nhận<\/text><text x=\"627.5\" y=\"81.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">(phần mềm thư)<\/text><text x=\"350.0\" y=\"129.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">SMTP: đẩy thư đi • POP3, IMAP: người nhận lấy thư về<\/text><\/svg><\/span><\/p><p><em>Hình 18. Hành trình của một thư điện tử<\/em><\/p><p><strong>e) HTTP và HTTPS:<\/strong> HTTP (cổng 80) truyền siêu văn bản dạng thường; <strong>HTTPS<\/strong> (cổng 443) là HTTP chạy trên lớp mã hóa TLS nên dữ liệu không bị đọc trộm giữa trình duyệt và máy chủ. Cấu trúc URL: giao-thức://tên-miền:cổng/đường-dẫn?tham-số. Ví dụ https://moet.gov.vn/tintuc.<\/p>"}, {"t": "9. ⭐ Địa chỉ IP và chia mạng con (chuyên sâu)", "h": "<p><strong>Các lớp địa chỉ IPv4 (theo byte đầu):<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Lớp<\/strong><\/th>\n<th><strong>Byte đầu<\/strong><\/th>\n<th><strong>Mặt nạ mặc định<\/strong><\/th>\n<th><strong>Ghi chú<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>A<\/td>\n<td>1 - 126<\/td>\n<td>255.0.0.0 (/8)<\/td>\n<td>Mạng rất lớn; 127.x.x.x là loopback<\/td>\n<\/tr><tr class=\"header\">\n<td>B<\/td>\n<td>128 - 191<\/td>\n<td>255.255.0.0 (/16)<\/td>\n<td>Mạng cỡ vừa<\/td>\n<\/tr><tr class=\"odd\">\n<td>C<\/td>\n<td>192 - 223<\/td>\n<td>255.255.255.0 (/24)<\/td>\n<td>Mạng nhỏ (LAN thông thường)<\/td>\n<\/tr><tr class=\"header\">\n<td>D<\/td>\n<td>224 - 239<\/td>\n<td>-<\/td>\n<td>Multicast (phát nhóm)<\/td>\n<\/tr><tr class=\"odd\">\n<td>E<\/td>\n<td>240 - 255<\/td>\n<td>-<\/td>\n<td>Dự phòng, thử nghiệm<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>Mặt nạ mạng con (subnet mask):<\/strong> dãy 32 bit gồm các bit 1 liên tiếp rồi các bit 0; bit 1 ứng với <strong>phần mạng<\/strong>, bit 0 ứng với <strong>phần máy<\/strong>. Viết /n nghĩa là n bit 1 đầu tiên.<\/p><ul>\n<li><p><strong>Địa chỉ mạng<\/strong> = IP AND mặt nạ (phần máy toàn bit 0).<\/p><\/li>\n<li><p><strong>Địa chỉ quảng bá (broadcast)<\/strong> = phần máy toàn bit 1; không gán cho máy.<\/p><\/li>\n<li><p><strong>Dải máy gán được:<\/strong> từ địa chỉ mạng + 1 đến broadcast - 1. Số máy = 2^h - 2 (h là số bit phần máy).<\/p><\/li>\n<li><p>Hai máy <strong>cùng mạng<\/strong> khi cùng địa chỉ mạng sau khi AND với mặt nạ; khác mạng thì phải liên lạc qua router.<\/p><\/li>\n<\/ul><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Mặt nạ<\/strong><\/th>\n<th><strong>Dạng dài<\/strong><\/th>\n<th><strong>Kích thước khối<\/strong><\/th>\n<th><strong>Số máy gán được<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>/24<\/td>\n<td>255.255.255.0<\/td>\n<td>256<\/td>\n<td>254<\/td>\n<\/tr><tr class=\"header\">\n<td>/25<\/td>\n<td>255.255.255.128<\/td>\n<td>128<\/td>\n<td>126<\/td>\n<\/tr><tr class=\"odd\">\n<td>/26<\/td>\n<td>255.255.255.192<\/td>\n<td>64<\/td>\n<td>62<\/td>\n<\/tr><tr class=\"header\">\n<td>/27<\/td>\n<td>255.255.255.224<\/td>\n<td>32<\/td>\n<td>30<\/td>\n<\/tr><tr class=\"odd\">\n<td>/28<\/td>\n<td>255.255.255.240<\/td>\n<td>16<\/td>\n<td>14<\/td>\n<\/tr><tr class=\"header\">\n<td>/29<\/td>\n<td>255.255.255.248<\/td>\n<td>8<\/td>\n<td>6<\/td>\n<\/tr><tr class=\"odd\">\n<td>/30<\/td>\n<td>255.255.255.252<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<\/tr><\/tbody><\/table><\/div><p><em>Mẹo: <strong>kích thước khối = 256 - giá trị byte mặt nạ<\/strong> (ví dụ 256 - 192 = 64). Các mạng con bắt đầu tại bội số của kích thước khối.<\/em><\/p><p><strong>Ví dụ 1.<\/strong> Xác định mạng của 192.168.10.77/26. Khối 64: các mạng 0, 64, 128, 192; 77 thuộc khối 64-127. <strong>Địa chỉ mạng 192.168.10.64; broadcast 192.168.10.127; máy gán được 192.168.10.65 đến .126 (62 máy).<\/strong><\/p><p><strong>Ví dụ 2.<\/strong> 172.16.45.200/20: mặt nạ 255.255.240.0, khối 16 ở byte thứ ba; 45 thuộc khối 32-47. <strong>Địa chỉ mạng 172.16.32.0; broadcast 172.16.47.255; dải máy 172.16.32.1 đến 172.16.47.254 (4094 máy).<\/strong><\/p><p><strong>Ví dụ 3.<\/strong> 192.168.1.10 và 192.168.1.200 có cùng mạng không? Với /24: có. Với /26: <strong>không<\/strong>, vì 10 thuộc khối 0-63 còn 200 thuộc khối 192-255.<\/p><p><strong>Ví dụ 4.<\/strong> Chia 192.168.1.0/24 thành 4 mạng con bằng nhau: mượn 2 bit phần máy, được 2^2 = 4 mạng /26, mỗi mạng 62 máy.<\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Mạng con<\/strong><\/th>\n<th><strong>Địa chỉ mạng<\/strong><\/th>\n<th><strong>Dải máy<\/strong><\/th>\n<th><strong>Broadcast<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>1<\/td>\n<td>192.168.1.0/26<\/td>\n<td>.1 - .62<\/td>\n<td>192.168.1.63<\/td>\n<\/tr><tr class=\"header\">\n<td>2<\/td>\n<td>192.168.1.64/26<\/td>\n<td>.65 - .126<\/td>\n<td>192.168.1.127<\/td>\n<\/tr><tr class=\"odd\">\n<td>3<\/td>\n<td>192.168.1.128/26<\/td>\n<td>.129 - .190<\/td>\n<td>192.168.1.191<\/td>\n<\/tr><tr class=\"header\">\n<td>4<\/td>\n<td>192.168.1.192/26<\/td>\n<td>.193 - .254<\/td>\n<td>192.168.1.255<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>Ví dụ 5.<\/strong> Mạng cần ít nhất 50 máy: tìm h nhỏ nhất thỏa 2^h - 2 ≥ 50; h = 6 (62 máy), vậy mặt nạ <strong>/26<\/strong>. Cần ít nhất 100 máy thì h = 7 (126 máy), mặt nạ <strong>/25<\/strong>.<\/p><p><strong>IPv6:<\/strong> 128 bit, viết thành 8 nhóm 16 bit hệ thập lục phân ngăn bởi dấu hai chấm; được rút gọn bỏ số 0 đầu mỗi nhóm và thay <strong>một<\/strong> dãy nhóm toàn 0 bằng \"::\". Ví dụ 2001:0db8:0000:0000:0000:0000:0000:0001 rút gọn thành 2001:db8::1.<\/p>"}, {"t": "10. ⭐ An toàn và bảo mật mạng", "h": "<div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Vấn đề / biện pháp<\/strong><\/th>\n<th><strong>Nội dung cần nhớ<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>Tường lửa (firewall)<\/td>\n<td>Kiểm soát dữ liệu vào/ra theo quy tắc, chặn truy cập trái phép; không thay thế phần mềm diệt virus<\/td>\n<\/tr><tr class=\"header\">\n<td>Bảo mật Wi-Fi<\/td>\n<td>WEP (yếu, lỗi thời) &lt; WPA &lt; WPA2 &lt; <strong>WPA3<\/strong> (an toàn nhất). Dùng mật khẩu mạnh, đổi mật khẩu quản trị mặc định của router, tắt WPS, cập nhật firmware<\/td>\n<\/tr><tr class=\"odd\">\n<td>HTTPS<\/td>\n<td>Mã hóa dữ liệu giữa trình duyệt và máy chủ; nhìn biểu tượng ổ khóa, địa chỉ bắt đầu bằng https<\/td>\n<\/tr><tr class=\"header\">\n<td>VPN (mạng riêng ảo)<\/td>\n<td>Tạo kênh truyền được mã hóa qua Internet, an toàn hơn khi dùng Wi-Fi công cộng<\/td>\n<\/tr><tr class=\"odd\">\n<td>Phishing (lừa đảo)<\/td>\n<td>Email/tin nhắn giả mạo dụ bấm liên kết, nhập mật khẩu hoặc OTP; kiểm tra người gửi, liên hệ kênh chính thức<\/td>\n<\/tr><tr class=\"header\">\n<td>DDoS<\/td>\n<td>Nhiều máy cùng gửi yêu cầu làm quá tải máy chủ khiến dịch vụ ngừng hoạt động<\/td>\n<\/tr><tr class=\"odd\">\n<td>Mã độc, ransomware<\/td>\n<td>Phần mềm độc hại; ransomware mã hóa dữ liệu rồi đòi tiền chuộc. Phòng: cập nhật, sao lưu, không mở tệp lạ<\/td>\n<\/tr><tr class=\"header\">\n<td>Nghe lén trên Wi-Fi công cộng<\/td>\n<td>Kẻ xấu có thể đọc dữ liệu không mã hóa; hạn chế đăng nhập tài khoản quan trọng, dùng HTTPS/VPN<\/td>\n<\/tr><\/tbody><\/table><\/div>"}, {"t": "11. ⭐ Chẩn đoán và xử lí sự cố mạng", "h": "<div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Lệnh (Windows)<\/strong><\/th>\n<th><strong>Tác dụng<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>ping địa-chỉ<\/td>\n<td>Kiểm tra kết nối bằng gói ICMP, đo thời gian phản hồi<\/td>\n<\/tr><tr class=\"header\">\n<td>ipconfig /all<\/td>\n<td>Xem IP, mặt nạ, gateway, DNS, địa chỉ MAC của máy<\/td>\n<\/tr><tr class=\"odd\">\n<td>tracert tên-miền<\/td>\n<td>Liệt kê các router (chặng) trên đường tới đích<\/td>\n<\/tr><tr class=\"header\">\n<td>nslookup tên-miền<\/td>\n<td>Tra cứu bản ghi DNS<\/td>\n<\/tr><tr class=\"odd\">\n<td>arp -a<\/td>\n<td>Xem bảng IP - MAC mà máy đã học<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>Đọc kết quả ping:<\/strong> \"Reply from ... time=12ms\" là thành công; \"Request timed out\" là không nhận được phản hồi (mất gói, đích tắt hoặc bị tường lửa chặn); \"Destination host unreachable\" là không có đường đến đích; \"could not find host\" là <strong>lỗi phân giải tên miền (DNS)<\/strong>.<\/p><p><span class=\"svgf\"><svg viewBox=\"0 0 700 372\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:700px;height:auto\" font-family=\"Segoe UI,Arial,sans-serif\" font-size=\"13\"><defs><marker id=\"m14\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9z\" fill=\"#475569\"/><\/marker><\/defs><rect x=\"10\" y=\"10\" width=\"260\" height=\"44\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"140.0\" y=\"36.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">1. ipconfig: có IP và gateway?<\/text><line x1=\"270\" y1=\"32\" x2=\"330\" y2=\"32\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"300.0\" y=\"27.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">lỗi<\/text><rect x=\"330\" y=\"10\" width=\"350\" height=\"44\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#475569\"/><text x=\"505.0\" y=\"36.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">IP 169.254.x.x → chưa nhận IP từ DHCP<\/text><line x1=\"140\" y1=\"54\" x2=\"140\" y2=\"72\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"165.0\" y=\"69.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#16a34a\">OK<\/text><rect x=\"10\" y=\"72\" width=\"260\" height=\"44\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"140.0\" y=\"98.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">2. ping 127.0.0.1<\/text><line x1=\"270\" y1=\"94\" x2=\"330\" y2=\"94\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"300.0\" y=\"89.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">lỗi<\/text><rect x=\"330\" y=\"72\" width=\"350\" height=\"44\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#475569\"/><text x=\"505.0\" y=\"98.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Card mạng / giao thức TCP/IP trên máy<\/text><line x1=\"140\" y1=\"116\" x2=\"140\" y2=\"134\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"165.0\" y=\"131.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#16a34a\">OK<\/text><rect x=\"10\" y=\"134\" width=\"260\" height=\"44\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"140.0\" y=\"160.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">3. ping gateway (192.168.1.1)<\/text><line x1=\"270\" y1=\"156\" x2=\"330\" y2=\"156\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"300.0\" y=\"151.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">lỗi<\/text><rect x=\"330\" y=\"134\" width=\"350\" height=\"44\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#475569\"/><text x=\"505.0\" y=\"160.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Cáp, switch, Wi-Fi hoặc cấu hình IP/gateway<\/text><line x1=\"140\" y1=\"178\" x2=\"140\" y2=\"196\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"165.0\" y=\"193.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#16a34a\">OK<\/text><rect x=\"10\" y=\"196\" width=\"260\" height=\"44\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"140.0\" y=\"222.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">4. ping 8.8.8.8<\/text><line x1=\"270\" y1=\"218\" x2=\"330\" y2=\"218\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"300.0\" y=\"213.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">lỗi<\/text><rect x=\"330\" y=\"196\" width=\"350\" height=\"44\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#475569\"/><text x=\"505.0\" y=\"222.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">Modem / router / nhà mạng<\/text><line x1=\"140\" y1=\"240\" x2=\"140\" y2=\"258\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"165.0\" y=\"255.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#16a34a\">OK<\/text><rect x=\"10\" y=\"258\" width=\"260\" height=\"44\" rx=\"9\" fill=\"#dbeafe\" stroke=\"#475569\"/><text x=\"140.0\" y=\"284.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">5. ping moet.gov.vn<\/text><line x1=\"270\" y1=\"280\" x2=\"330\" y2=\"280\" stroke=\"#dc2626\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"300.0\" y=\"275.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#dc2626\">lỗi<\/text><rect x=\"330\" y=\"258\" width=\"350\" height=\"44\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#475569\"/><text x=\"505.0\" y=\"284.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\">DNS cấu hình sai hoặc không phản hồi<\/text><line x1=\"140\" y1=\"302\" x2=\"140\" y2=\"320\" stroke=\"#16a34a\" stroke-width=\"2\" marker-end=\"url(#m14)\"/><text x=\"165.0\" y=\"317.7\" text-anchor=\"start\" font-size=\"11\" fill=\"#16a34a\">OK<\/text><rect x=\"10\" y=\"320\" width=\"260\" height=\"40\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#475569\"/><text x=\"140.0\" y=\"344.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0f172a\" font-weight=\"700\">Mạng hoạt động bình thường<\/text><\/svg><\/span><\/p><p><em>Hình 19. Quy trình xử lí sự cố mất Internet từ trong ra ngoài<\/em><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Triệu chứng<\/strong><\/th>\n<th><strong>Nguyên nhân khả dĩ nhất<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>Đèn cổng mạng không sáng<\/td>\n<td>Cáp hỏng, đầu RJ45 lỏng, cổng switch hỏng<\/td>\n<\/tr><tr class=\"header\">\n<td>Máy có IP 169.254.x.x<\/td>\n<td>Không nhận được IP từ DHCP (router/DHCP lỗi hoặc cáp, Wi-Fi chưa nối)<\/td>\n<\/tr><tr class=\"odd\">\n<td>Chỉ một máy mất mạng, máy khác bình thường<\/td>\n<td>Cáp, card mạng hoặc cấu hình IP của máy đó<\/td>\n<\/tr><tr class=\"header\">\n<td>LAN vẫn chia sẻ tệp được nhưng không ra Internet<\/td>\n<td>Modem/router, đường truyền nhà mạng (ISP)<\/td>\n<\/tr><tr class=\"odd\">\n<td>Ping được 8.8.8.8 nhưng không vào được trang web bằng tên<\/td>\n<td>DNS (đổi máy chủ DNS)<\/td>\n<\/tr><tr class=\"header\">\n<td>Mạng chậm khi nhiều máy dùng hub<\/td>\n<td>Hub: một miền xung đột; thay bằng switch<\/td>\n<\/tr><tr class=\"odd\">\n<td>Wi-Fi chập chờn ở xa router<\/td>\n<td>Tín hiệu yếu; thêm AP/repeater, ưu tiên 5 GHz khi ở gần<\/td>\n<\/tr><tr class=\"header\">\n<td>Thông báo xung đột địa chỉ IP<\/td>\n<td>Hai máy trùng IP; dùng DHCP hoặc đặt IP khác nhau<\/td>\n<\/tr><\/tbody><\/table><\/div>"}, {"t": "12. ⭐ Bài toán thiết kế mạng mẫu", "h": "<p><strong>Đề bài:<\/strong> Trường THPT có 3 phòng máy thực hành, mỗi phòng 25 máy; khu hiệu bộ có 12 máy tính và 1 máy in; 1 máy chủ dùng chung; giáo viên cần Wi-Fi ở khu hiệu bộ. Khu phòng máy cách khu hiệu bộ khoảng 120 m. Trường có đường Internet cáp quang. Hãy thiết kế mạng theo 4 bước.<\/p><p><strong>Bước 1 - Khảo sát, phân tích:<\/strong> khoảng 87 máy tính, 1 máy in, 1 máy chủ; nhu cầu: thực hành, truy cập Internet, chia sẻ tệp, in ấn, Wi-Fi cho giáo viên; khoảng cách giữa hai khu 120 m lớn hơn giới hạn 100 m của cáp xoắn.<\/p><p><strong>Bước 2 - Thiết kế logic:<\/strong> cấu trúc <strong>hình sao phân cấp<\/strong> (mỗi phòng một hình sao, nối về switch trung tâm). Chia thành các phân đoạn riêng cho từng phòng để giảm xung đột và dễ quản lí. Với số máy lớn và cần quản lí tài khoản học sinh tập trung nên dùng mô hình <strong>domain<\/strong>.<\/p><p><strong>Bước 3 - Thiết kế vật lí:<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Vị trí<\/strong><\/th>\n<th><strong>Thiết bị / cáp<\/strong><\/th>\n<th><strong>Số lượng<\/strong><\/th>\n<th><strong>Lí do<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>Mỗi phòng máy<\/td>\n<td>Switch 48 cổng<\/td>\n<td>3<\/td>\n<td>25 máy + cổng nối lên + dự phòng (24 cổng không đủ)<\/td>\n<\/tr><tr class=\"header\">\n<td>Khu hiệu bộ<\/td>\n<td>Switch 16 cổng<\/td>\n<td>1<\/td>\n<td>12 máy + máy in + AP + cổng nối lên = 15 cổng<\/td>\n<\/tr><tr class=\"odd\">\n<td>Trung tâm<\/td>\n<td>Switch 8 cổng<\/td>\n<td>1<\/td>\n<td>Nối 3 phòng, khu hiệu bộ, máy chủ, router<\/td>\n<\/tr><tr class=\"header\">\n<td>Cửa ngõ Internet<\/td>\n<td>Modem quang + router (hoặc modem tích hợp router)<\/td>\n<td>1<\/td>\n<td>Một cổng WAN ra Internet<\/td>\n<\/tr><tr class=\"odd\">\n<td>Khu hiệu bộ<\/td>\n<td>Access point<\/td>\n<td>1<\/td>\n<td>Phát Wi-Fi cho giáo viên<\/td>\n<\/tr><tr class=\"header\">\n<td>Trong phòng, trong tòa<\/td>\n<td>Cáp UTP CAT 6<\/td>\n<td>Theo thực tế<\/td>\n<td>Mỗi đoạn không quá 100 m<\/td>\n<\/tr><tr class=\"odd\">\n<td>Giữa khu phòng máy và hiệu bộ (120 m)<\/td>\n<td>Cáp quang<\/td>\n<td>1 tuyến<\/td>\n<td>Vượt quá giới hạn cáp xoắn, chống nhiễu<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>Bước 4 - Hệ điều hành mạng:<\/strong> Windows (phù hợp trường học, dễ quản trị, hỗ trợ domain); máy chủ cài các dịch vụ chia sẻ tệp, in ấn, DHCP/DNS nội bộ.<\/p><p><em><strong>Mở rộng:<\/strong> thêm tường lửa, tách mạng Wi-Fi giáo viên khỏi mạng phòng máy (như mô hình tách mạng nội bộ / khách ở nhà hàng), sao lưu dữ liệu máy chủ.<\/em><\/p>"}, {"t": "Bài tập tính toán (đổi IP, số máy, mạng con)", "h": "<p><strong>1. Chuyển đổi địa chỉ IP<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Đề bài<\/strong><\/th>\n<th><strong>Kết quả<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>11000000 10101000 00001010 00000001<\/td>\n<td>192.168.10.1<\/td>\n<\/tr><tr class=\"header\">\n<td>10101100 00010000 00000001 00000010<\/td>\n<td>172.16.1.2<\/td>\n<\/tr><tr class=\"odd\">\n<td>00001010 00000000 00000000 01101001<\/td>\n<td>10.0.0.105<\/td>\n<\/tr><tr class=\"header\">\n<td>172.18.5.9<\/td>\n<td>10101100 00010010 00000101 00001001<\/td>\n<\/tr><tr class=\"odd\">\n<td>192.168.100.25<\/td>\n<td>11000000 10101000 01100100 00011001<\/td>\n<\/tr><\/tbody><\/table><\/div><p><em>Cách làm: mỗi byte 8 bit có trọng số 128, 64, 32, 16, 8, 4, 2, 1.<\/em><\/p><p><strong>2. Số máy trong mạng con<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Mạng<\/strong><\/th>\n<th><strong>Số bit phần máy<\/strong><\/th>\n<th><strong>Số máy gán được<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>/24 (255.255.255.0)<\/td>\n<td>8<\/td>\n<td>2^8 - 2 = 254<\/td>\n<\/tr><tr class=\"header\">\n<td>/26<\/td>\n<td>6<\/td>\n<td>2^6 - 2 = 62<\/td>\n<\/tr><tr class=\"odd\">\n<td>/28<\/td>\n<td>4<\/td>\n<td>2^4 - 2 = 14<\/td>\n<\/tr><tr class=\"header\">\n<td>/30<\/td>\n<td>2<\/td>\n<td>2^2 - 2 = 2<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>3. Bảng định tuyến<\/strong><\/p><p>Bảng: 126.13.*.* → cổng 1; 172.18.*.* → cổng 2; 113.23.12.* → cổng 3; 230.17.*.* → cổng 4; còn lại → tuyến mặc định.<\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>IP đích<\/strong><\/th>\n<th><strong>Cổng ra<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>126.13.7.7<\/td>\n<td>1<\/td>\n<\/tr><tr class=\"header\">\n<td>172.18.0.1<\/td>\n<td>2<\/td>\n<\/tr><tr class=\"odd\">\n<td>113.23.12.200<\/td>\n<td>3<\/td>\n<\/tr><tr class=\"header\">\n<td>230.17.1.1<\/td>\n<td>4<\/td>\n<\/tr><tr class=\"odd\">\n<td>113.23.13.1<\/td>\n<td>Không khớp (113.23.13 khác 113.23.12) → tuyến mặc định<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>4. Chia mạng con và xác định địa chỉ mạng<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Đề bài<\/strong><\/th>\n<th><strong>Địa chỉ mạng<\/strong><\/th>\n<th><strong>Broadcast<\/strong><\/th>\n<th><strong>Dải máy (số máy)<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>10.1.2.3/8<\/td>\n<td>10.0.0.0<\/td>\n<td>10.255.255.255<\/td>\n<td>10.0.0.1 đến 10.255.255.254<\/td>\n<\/tr><tr class=\"header\">\n<td>172.16.5.9/16<\/td>\n<td>172.16.0.0<\/td>\n<td>172.16.255.255<\/td>\n<td>172.16.0.1 đến 172.16.255.254<\/td>\n<\/tr><tr class=\"odd\">\n<td>192.168.5.130/25<\/td>\n<td>192.168.5.128<\/td>\n<td>192.168.5.255<\/td>\n<td>.129 đến .254 (126 máy)<\/td>\n<\/tr><tr class=\"header\">\n<td>192.168.1.100/27<\/td>\n<td>192.168.1.96<\/td>\n<td>192.168.1.127<\/td>\n<td>.97 đến .126 (30 máy)<\/td>\n<\/tr><tr class=\"odd\">\n<td>192.168.10.77/26<\/td>\n<td>192.168.10.64<\/td>\n<td>192.168.10.127<\/td>\n<td>.65 đến .126 (62 máy)<\/td>\n<\/tr><\/tbody><\/table><\/div><p><em>Cách làm: lấy kích thước khối (256 - byte mặt nạ), tìm khối chứa byte cần xét; địa chỉ mạng là đầu khối, broadcast là cuối khối.<\/em><\/p><p><strong>5. Bài tập tự luyện<\/strong><\/p><p><strong>4. Bài tập tự luyện<\/strong><\/p><ul>\n<li><p>Xác định địa chỉ mạng, broadcast và số máy của 192.168.7.200/28. (Đáp án: mạng 192.168.7.192; broadcast 192.168.7.207; 14 máy.)<\/p><\/li>\n<li><p>Chia 192.168.20.0/24 thành 8 mạng con bằng nhau: mặt nạ nào, mỗi mạng bao nhiêu máy? (Đáp án: /27, 30 máy.)<\/p><\/li>\n<li><p>Đổi 192.0.2.77 sang nhị phân.<\/p><\/li>\n<li><p>Trong 5 địa chỉ 1.1.1.1; 192.168.1; 10.256.1.1; 172.31.255.254; 300.1.1.1, có mấy địa chỉ IPv4 hợp lệ? (Đáp án: 2, gồm 1.1.1.1 và 172.31.255.254.)<\/p><\/li>\n<li><p>Truyền tệp 1,2 GB qua mạng 1 Gb/s mất khoảng bao lâu? (Gợi ý: 1,2 × 1024 × 8 Mb chia cho 1000 Mb/s, khoảng 9,8 s lí thuyết.)<\/p><\/li>\n<\/ul>"}, {"t": "An toàn thông tin và ứng xử trên mạng", "h": "<p>Đề thi có hai câu thuộc nhóm này (câu 4 và câu 11), thường liên quan mạng xã hội và email.<\/p><ul>\n<li><p><strong>Email/tin nhắn lừa đảo (phishing):<\/strong> yêu cầu bấm liên kết để \"cập nhật tài khoản\", nhập mật khẩu, mã OTP. Cách xử lí: <strong>không bấm liên kết, không cung cấp thông tin<\/strong>, xác minh và liên hệ trực tiếp ngân hàng qua kênh chính thức (số tổng đài, ứng dụng chính thức).<\/p><\/li>\n<li><p><strong>Tin tức gây xúc động, kêu gọi chuyển tiền:<\/strong> bình tĩnh kiểm chứng danh tính chủ tài khoản và nguồn gốc hình ảnh; ủng hộ qua kênh chính thống; không chia sẻ vội, không chế giễu hay công kích nạn nhân.<\/p><\/li>\n<li><p><strong>Chia sẻ thông tin trên mạng:<\/strong> tôn trọng bản quyền, bảo vệ dữ liệu cá nhân, cảnh giác ảnh/video/âm thanh giả mạo do AI tạo ra.<\/p><\/li>\n<\/ul><p><strong>Câu 1.<\/strong> Nhận được email tự xưng ngân hàng yêu cầu cập nhật thông tin tài khoản qua một liên kết. Biện pháp phù hợp nhất:<\/p><p>A. Chuyển tiếp cho bạn bè hỏi ý kiến mà không kiểm tra thêm<\/p><p>B. Xác minh email, liên hệ trực tiếp ngân hàng qua kênh chính thức trước khi hành động<\/p><p>C. Nhập thông tin vào liên kết để kiểm tra email có hợp lệ không<\/p><p>D. Tắt máy và không làm gì thêm<\/p><p><strong>Đáp án: B<\/strong><\/p><p><strong>Câu 2.<\/strong> Mạng xã hội lan truyền bức ảnh người dân ngồi trên nóc nhà chờ cứu hộ kèm lời kêu gọi chuyển tiền vào tài khoản cá nhân. Hành động phù hợp là:<\/p><p>A. Chế ảnh hài hước đăng lên mạng<\/p><p>B. Bình luận chê bai người dân<\/p><p>C. Chia sẻ ngay lên các nhóm với cảm xúc mạnh<\/p><p>D. Kiểm chứng danh tính chủ tài khoản, nguồn ảnh và ủng hộ qua kênh chính thống<\/p><p><strong>Đáp án: D<\/strong><\/p>"}, {"t": "Câu hỏi tự luận ngắn & bài thực hành (có gợi ý)", "h": "<p><strong>Câu hỏi tự luận ngắn (kèm gợi ý đáp án):<\/strong><\/p><p><strong>1. So sánh hub, switch và router (ít nhất 4 tiêu chí).<\/strong><\/p><div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Tiêu chí<\/strong><\/th>\n<th><strong>Hub<\/strong><\/th>\n<th><strong>Switch<\/strong><\/th>\n<th><strong>Router<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>Chức năng<\/td>\n<td>Phát tán tín hiệu ra mọi cổng<\/td>\n<td>Chuyển đúng cổng theo MAC<\/td>\n<td>Chuyển gói tin giữa các mạng theo IP<\/td>\n<\/tr><tr class=\"header\">\n<td>Địa chỉ làm việc<\/td>\n<td>Không xử lí địa chỉ<\/td>\n<td>MAC<\/td>\n<td>IP<\/td>\n<\/tr><tr class=\"odd\">\n<td>Miền xung đột<\/td>\n<td>Một miền chung<\/td>\n<td>Mỗi cổng một miền<\/td>\n<td>Mỗi cổng một miền<\/td>\n<\/tr><tr class=\"header\">\n<td>Miền quảng bá<\/td>\n<td>Một miền<\/td>\n<td>Một miền<\/td>\n<td>Mỗi cổng một miền<\/td>\n<\/tr><tr class=\"odd\">\n<td>Cổng đặc trưng<\/td>\n<td>Cổng LAN<\/td>\n<td>Cổng LAN<\/td>\n<td>Cổng LAN và cổng WAN<\/td>\n<\/tr><\/tbody><\/table><\/div><p><strong>2. Vì sao nhiều máy trong LAN vẫn ra được Internet chỉ với một địa chỉ IP công cộng?<\/strong> Gợi ý: mỗi máy dùng IP riêng; router thực hiện NAT, đổi IP riêng thành IP công cộng của router khi gửi ra ngoài và ghi nhớ để trả dữ liệu về đúng máy.<\/p><p><strong>3. Trình bày các bước một máy nhận địa chỉ IP bằng DHCP.<\/strong> Gợi ý: Discover (máy khách tìm máy chủ) → Offer (máy chủ đề nghị IP) → Request (máy khách chấp nhận) → ACK (máy chủ xác nhận, cho thuê trong một thời gian), kèm mặt nạ, gateway, DNS.<\/p><p><strong>4. Nêu các bước chia sẻ một thư mục cho mọi người chỉ xem và cách hủy chia sẻ.<\/strong> Gợi ý: bật Network discovery và File and printer sharing; Properties → Sharing → Share; chọn Everyone, đặt quyền Read; hủy bằng cách bỏ chọn Share this folder trong Advanced Sharing.<\/p><p><strong>5. Phòng máy 30 máy cần Internet, máy in dùng chung, Wi-Fi cho giáo viên. Đề xuất thiết bị và giải thích.<\/strong> Gợi ý: switch 48 cổng (hoặc 2 switch 24 cổng), router/modem ra Internet, 1 AP, máy in chia sẻ qua máy chủ in hoặc nối mạng, cấu trúc hình sao, cáp UTP CAT 6; nêu rõ vì sao chọn switch thay hub.<\/p><p><strong>6. LAN trường học vẫn truy cập tài nguyên nội bộ nhưng mất Internet. Nêu cách xác định nguyên nhân.<\/strong> Gợi ý: ping gateway, ping 8.8.8.8, ping tên miền; kết luận lỗi modem/router/nhà mạng hay DNS.<\/p><p><strong>Bài thực hành gợi ý:<\/strong><\/p><ul>\n<li><p>Dùng ipconfig /all ghi lại IP, mặt nạ, gateway, DNS, MAC của máy mình; xác định máy thuộc mạng nào.<\/p><\/li>\n<li><p>Dùng ping tới gateway, 8.8.8.8 và một tên miền; dùng tracert đến một trang web và đếm số chặng.<\/p><\/li>\n<li><p>Chia sẻ một thư mục giữa hai máy với quyền Read, kiểm tra không sửa được; sau đó đổi sang Read/Write.<\/p><\/li>\n<li><p>Chia sẻ và kết nối một máy in trong mạng.<\/p><\/li>\n<li><p>Quan sát một sơ đồ mạng thật của trường: liệt kê thiết bị, cấu trúc kết nối, vị trí access point.<\/p><\/li>\n<\/ul>"}, {"t": "Bảng thuật ngữ Anh - Việt", "h": "<div class=\"tw\"><table><thead><tr class=\"header\">\n<th><strong>Thuật ngữ<\/strong><\/th>\n<th><strong>Nghĩa<\/strong><\/th>\n<th><strong>Thuật ngữ<\/strong><\/th>\n<th><strong>Nghĩa<\/strong><\/th>\n<\/tr><\/thead><tbody><tr class=\"odd\">\n<td>LAN / WAN<\/td>\n<td>Mạng cục bộ / mạng diện rộng<\/td>\n<td>Gateway<\/td>\n<td>Cổng mặc định (router)<\/td>\n<\/tr><tr class=\"header\">\n<td>Protocol<\/td>\n<td>Giao thức<\/td>\n<td>Subnet mask<\/td>\n<td>Mặt nạ mạng con<\/td>\n<\/tr><tr class=\"odd\">\n<td>Packet / Frame<\/td>\n<td>Gói tin / Khung dữ liệu<\/td>\n<td>Bandwidth<\/td>\n<td>Băng thông<\/td>\n<\/tr><tr class=\"header\">\n<td>Latency<\/td>\n<td>Độ trễ<\/td>\n<td>Topology<\/td>\n<td>Cấu trúc (hình trạng) mạng<\/td>\n<\/tr><tr class=\"odd\">\n<td>Client / Server<\/td>\n<td>Máy khách / Máy chủ<\/td>\n<td>Port<\/td>\n<td>Cổng ứng dụng<\/td>\n<\/tr><tr class=\"header\">\n<td>Hub / Switch<\/td>\n<td>Bộ tập trung / Bộ chuyển mạch<\/td>\n<td>Router<\/td>\n<td>Bộ định tuyến<\/td>\n<\/tr><tr class=\"odd\">\n<td>Access Point<\/td>\n<td>Điểm truy cập không dây<\/td>\n<td>Repeater<\/td>\n<td>Bộ lặp (khuếch đại tín hiệu)<\/td>\n<\/tr><tr class=\"header\">\n<td>Modulation<\/td>\n<td>Điều chế<\/td>\n<td>Demodulation<\/td>\n<td>Giải điều chế<\/td>\n<\/tr><tr class=\"odd\">\n<td>Firewall<\/td>\n<td>Tường lửa<\/td>\n<td>Phishing<\/td>\n<td>Lừa đảo giả mạo<\/td>\n<\/tr><tr class=\"header\">\n<td>ISP<\/td>\n<td>Nhà cung cấp dịch vụ Internet<\/td>\n<td>Broadcast<\/td>\n<td>Quảng bá (gửi tới mọi máy)<\/td>\n<\/tr><tr class=\"odd\">\n<td>Collision domain<\/td>\n<td>Miền xung đột<\/td>\n<td>Routing table<\/td>\n<td>Bảng định tuyến<\/td>\n<\/tr><\/tbody><\/table><\/div>"}, {"t": "⚡ Sơ đồ tư duy, mẹo làm bài & bảng từ khóa", "h": "<p><img src=\"data:image/webp;base64,UklGRr45AABXRUJQVlA4ILI5AADwIAGdASqEA+YBPm0ylkkkIqKhIfN6GIANiWdu/BGnVtlYj/hHjt81V678xTrxi+o8cJ8H/kfst7vf1LvZvMN5vn/Q9X3+   const own = (ids, v) => ids.map(id => N[id]).find(n => n.t === 'rt' ? n.ifs.some(f => ip2n(f.ip) === v) : ip2n(n.ip) === v);
  const lan = nbrs(sc, src).flatMap(f => reach(sc, src, f));
  if (same(si, t, sm)) {
    const d = own(lan, t); if (!d) return { ok: 0, u: 1, why: 'Không có thiết bị nào cùng LAN mang IP này (kiểm tra IP đích, mask, cáp/switch).' };
    if (d.t === 'pc') { const e2 = badCfg(d); if (e2) return { ok: 0, why: e2 }; if (!same(si, ip2n(d.ip), mk2n(d.m))) return { ok: 0, why: `${d.n} dùng mask khác nên coi máy gửi thuộc mạng khác → không trả lời được.` }; }
    return { ok: 1 };
  }
  const gw = ip2n(S.g);
  if (gw === null) return { ok: 0, u: 1, why: `Đích khác mạng con nhưng ${S.n} chưa có gateway.` };
  if (!same(si, gw, sm)) return { ok: 0, u: 1, why: 'Gateway không cùng mạng con với máy gửi.' };
  const rid = lan.find(id => N[id].t === 'rt' && N[id].ifs.some(f => ip2n(f.ip) === gw));
  if (!rid) return { ok: 0, u: 1, why: 'Không có router nào mang địa chỉ gateway này trong LAN của máy gửi.' };
  const R = N[rid];
  for (const f of R.ifs) {
    const fi = ip2n(f.ip), fm = mk2n(f.m); if (fi === null || fm === null || !same(fi, t, fm)) continue;
    const d = own(reach(sc, rid, f.to), t); if (!d) return { ok: 0, why: 'Router không tìm thấy máy có IP này ở mạng nối trực tiếp.' };
    if (d.t === 'pc') { const e2 = badCfg(d); if (e2) return { ok: 0, why: e2 }; if (ip2n(d.g) !== fi) return { ok: 0, why: `${d.n} chưa đặt gateway đúng (${f.ip}) nên không gửi trả lời về được.` }; }
    return { ok: 1 };
  }
  const nt = R.ifs.map(f => N[f.to]).find(n => n && n.t === 'net');
  if (nt && ip2n(nt.ip) === t) return { ok: 1 };
  return { ok: 0, why: 'Router không có đường tới mạng đích.' };
}
let LB = null;
function labLoad(i) { LB = { i, sc: JSON.parse(JSON.stringify(LABS[i])), sel: null, out: '', hint: LB ? LB.hint : true }; netLab(); }
function netLab() {
  if (!LB) return labLoad(0);
  $('#app').innerHTML = `<div class="dvt">${LABS.map((l, i) => `<button data-l="${i}" class="${i === LB.i ? 'on' : ''}">${esc(l.name)}</button>`).join('')}<button data-l="r">↺ Làm lại</button></div><p><b>Đề bài:</b> ${esc(LB.sc.task)}</p><div class="nl"><div><svg viewBox="0 0 640 300" class="dvs" id="lsv"></svg><pre class="bin" id="lt"></pre><input id="lin" placeholder="Chọn một PC trên sơ đồ, rồi gõ: ipconfig | ping 192.168.1.10 | help" autocomplete="off"><label class="sm"><input type="checkbox" id="lh" ${LB.hint ? 'checked' : ''}> Hiện chẩn đoán khi ping thất bại</label></div><div><div id="lp"></div><div class="h4">Nhiệm vụ</div><ul id="lg"></ul></div></div>`;
  labPanel(); labRefresh();
}
function labPanel() {
  const n = LB.sel && LB.sc.nodes[LB.sel], p = $('#lp');
  if (!n || n.t === 'sw' || n.t === 'net') { p.innerHTML = '<p class="sm">👆 Bấm vào một PC hoặc router trên sơ đồ để cấu hình địa chỉ.</p>'; return; }
  const f = (lab, k, v, o) => `<label class="lf">${lab}<input data-k="${k}"${o !== undefined ? ` data-o="${o}"` : ''} value="${esc(v || '').replace(/"/g, '&quot;')}" autocomplete="off"></label>`;
  p.innerHTML = `<div class="h4">Cấu hình ${esc(n.n)}</div>` + (n.t === 'pc' ? f('Địa chỉ IP', 'ip', n.ip) + f('Mặt nạ mạng (mask)', 'm', n.m) + f('Gateway', 'g', n.g)
    : n.ifs.map((i, k) => `<b class="sm">Cổng ${k + 1} (nối tới ${esc(LB.sc.nodes[i.to].n)})</b>` + f('IP', 'ip', i.ip, k) + f('Mask', 'm', i.m, k)).join(''));
}
function labRefresh() {
  const sc = LB.sc, N = sc.nodes;
  $('#lsv').innerHTML = sc.links.map(l => `<line x1="${N[l[0]].x}" y1="${N[l[0]].y}" x2="${N[l[1]].x}" y2="${N[l[1]].y}" stroke="#94a3b8" stroke-width="3"/>`).join('') + Object.entries(N).map(([id, n]) => {
    const L = n.t === 'pc' ? [n.n, n.ip || '(chưa có IP)'] : n.t === 'rt' ? [n.n, ...n.ifs.map(f => f.ip || '—')] : n.t === 'net' ? [n.n, n.ip] : [n.n], h = 18 + L.length * 15, w = n.t === 'sw' ? 84 : 124, sel = LB.sel === id;
    return `<g data-n="${id}" style="cursor:pointer"><rect x="${n.x - w / 2}" y="${n.y - h / 2}" width="${w}" height="${h}" rx="9" fill="${{ pc: '#dbeafe', sw: '#f1f5f9', rt: '#fef9c3', net: '#ede9fe' }[n.t]}" stroke="${sel ? '#0e7490' : '#475569'}" stroke-width="${sel ? 4 : 1.5}"/>` + L.map((s, k) => `<text x="${n.x}" y="${n.y - h / 2 + 18 + k * 15}" text-anchor="middle" font-size="${k ? 11 : 12}" font-weight="${k ? 400 : 700}">${esc(s)}</text>`).join('') + '</g>';
  }).join('');
  $('#lt').textContent = LB.out || 'Chọn PC trên sơ đồ → cấu hình bên phải → gõ lệnh. Gõ help để xem lệnh.';
  const ok = sc.goals.map(g => ping(sc, g[1], N[g[2]] ? N[g[2]].ip : g[2]).ok);
  $('#lg').innerHTML = sc.goals.map((g, i) => `<li>${ok[i] ? '✔' : '✘'} ${esc(g[0])}</li>`).join('');
  if (ok.every(Boolean) && !(G.labs || (G.labs = [])).includes(LB.i)) { G.labs.push(LB.i); add(40); badge('lab'); boom(); toast('🛠️ Hoàn thành bài lab! +40 XP'); save(); xpDraw(); }
}
function labCmd(c) {
  c = c.trim(); if (!c) return;
  const S = LB.sel && LB.sc.nodes[LB.sel]; let r;
  if (/^help$/i.test(c)) r = 'Lệnh: ipconfig | ping <địa chỉ IP> (ví dụ ping 192.168.1.11) | ping 127.0.0.1';
  else if (!S || S.t !== 'pc') r = 'Hãy chọn một PC trên sơ đồ trước.';
  else if (/^ipconfig$/i.test(c)) r = `IPv4 Address . . : ${S.ip || '(chưa cấu hình)'}\nSubnet Mask . . . : ${S.m || '(chưa cấu hình)'}\nDefault Gateway . : ${S.g || '(trống)'}`;
  else {
    const m = c.match(/^ping\s+(\S+)$/i);
    if (!m) r = 'Lệnh không hợp lệ. Gõ help.';
    else { const x = ping(LB.sc, LB.sel, m[1]); r = x.ok ? `Reply from ${m[1]}: bytes=32 time<1ms TTL=64\n(0% mất gói)` : (x.u ? `Reply from ${S.ip || 'máy này'}: Destination host unreachable.` : 'Request timed out.') + (LB.hint ? `\n→ ${x.why}` : ''); }
  }
  LB.out += `${S ? S.n : '?'}> ${c}\n${r}\n\n`; labRefresh(); const t = $('#lt'); t.scrollTop = t.scrollHeight;
}
$('#app').addEventListener('click', e => {
  if (st.m !== 'k' || !LB) return;
  const b = e.target.closest('[data-l]'); if (b) return labLoad(b.dataset.l === 'r' ? LB.i : +b.dataset.l);
  const g = e.target.closest('[data-n]'); if (g) { LB.sel = g.dataset.n; labPanel(); labRefresh(); }
});
$('#app').addEventListener('input', e => {
  if (st.m !== 'k' || !LB || !e.target.dataset.k) return;
  const n = LB.sc.nodes[LB.sel], d = e.target.dataset; (d.o !== undefined ? n.ifs[+d.o] : n)[d.k] = e.target.value; labRefresh();
});
$('#app').addEventListener('keydown', e => { if (st.m === 'k' && e.key === 'Enter' && e.target.id === 'lin') { labCmd(e.target.value); e.target.value = ''; } });
$('#app').addEventListener('change', e => { if (st.m === 'k' && LB && e.target.id === 'lh') LB.hint = e.target.checked; });

/* --- Tra cứu, chế độ tối, tên học sinh, phóng to ảnh --- */
$('#sr').addEventListener('input', e => {
  if (st.m === 'x' && ex && !ex.done) return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return start();
  st.m = 'g'; stopTick(); ex = null; document.body.classList.remove('exam'); setTab();
  const seen = {}, r = [];
  DATA.forEach(L => L.gn.forEach(s => { if (seen[s.t]) return; seen[s.t] = 1; if ((s.t + ' ' + s.h.replace(/<[^>]+>/g, ' ')).toLowerCase().includes(q)) r.push(s); }));
  $('#app').innerHTML = r.length ? r.map(s => `<details class="gn" open><summary>${esc(s.t)}</summary><div>${s.h}</div></details>`).join('') : '<p>Không tìm thấy mục nào khớp.</p>'; if ($('#dev')) devInit();
});
try { if (localStorage.getItem('hsg_dk') === '1') document.body.classList.add('dark'); $('#nm').value = localStorage.getItem('hsg_nm') || ''; } catch (e) {}
$('#dk').onclick = () => { const d = document.body.classList.toggle('dark'); try { localStorage.setItem('hsg_dk', d ? '1' : '0'); } catch (e) {} };
$('#nm').oninput = e => { try { localStorage.setItem('hsg_nm', e.target.value); } catch (x) {} };
$('#app').addEventListener('click', xclick); $('#side').addEventListener('click', xclick);
document.addEventListener('click', e => {
  const im = e.target.closest('#app img'), sv = e.target.closest('#app .svgf svg'), lb = $('#lb');
  if (im) { lb.innerHTML = `<img src="${im.src}" alt="">`; lb.style.display = 'flex'; }
  else if (sv) { lb.innerHTML = `<div style="background:#fff;padding:14px;border-radius:12px;width:min(96vw,1000px)">${sv.outerHTML}</div>`; lb.style.display = 'flex'; }
  else if (e.target.closest('#lb')) lb.style.display = 'none';
});
/* ===== GAME HÓA: XP, hạng, chuỗi đúng, huy hiệu, âm thanh, pháo giấy ===== */
const RANKS = [[0, '🌱 Tân binh'], [150, '🔧 Kỹ thuật viên'], [400, '🛰️ Kỹ sư mạng'], [800, '🏅 Chuyên gia'], [1500, '👑 HSG Master']];
const BG = { first: ['🎯', 'Khởi động', 'Trả lời đúng câu đầu tiên'], c5: ['🔥', 'Chuỗi 5', '5 câu đúng liên tiếp'], c10: ['⚡', 'Chuỗi 10', '10 câu đúng liên tiếp'], o50: ['📚', 'Chăm chỉ', 'Đúng 50 câu'], trap: ['🪤', 'Thợ săn bẫy', 'Đúng 10 ý bẫy'], perf: ['💯', 'Hoàn hảo', '100% một lượt luyện'], exam: ['🏆', 'Chiến binh phòng thi', 'Thi thử từ 8/10'], det: ['🕵️', 'Thám tử mạng', 'Giải đúng tình huống sự cố'], goal: ['🎯', 'Đủ chỉ tiêu', '20 câu trong một ngày'], lab: ['🛠️', 'Kỹ sư dựng mạng', 'Hoàn thành một bài lab dựng mạng'] };
const DG = { xp: 0, ok: 0, trap: 0, best: 0, badges: [], last: '', days: 0, tdN: 0 };
let G = { ...DG }, combo = 0, snd = true, AC;
try { Object.assign(G, JSON.parse(localStorage.getItem('hsg_net_gm') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('hsg_net_gm', JSON.stringify(G)); } catch (e) {} };
const rank = () => RANKS.reduce((r, x, k) => G.xp >= x[0] ? k : r, 0);
const today = () => new Date().toISOString().slice(0, 10);
if (G.last !== today()) { G.days = G.last === new Date(Date.now() - 864e5).toISOString().slice(0, 10) ? G.days + 1 : 1; G.last = today(); G.tdN = 0; save(); }
const cheer = () => ['Chính xác!', 'Quá đỉnh!', 'Chuẩn luôn!', 'Tuyệt vời!', 'Đúng rồi!'][Math.floor(Math.random() * 5)] + (combo >= 3 ? ` 🔥 Chuỗi ${combo}!` : '');
function xpDraw() {
  const r = rank(), nx = RANKS[r + 1], lo = RANKS[r][0];
  $('#xp').innerHTML = `<span>${RANKS[r][1]}</span><div class="bar"><i style="width:${nx ? (G.xp - lo) / (nx[0] - lo) * 100 : 100}%"></i></div><span>${G.xp} XP</span><span>🔥 ${G.days} ngày</span><span>🎯 ${Math.min(G.tdN, 20)}/20 câu hôm nay</span><span>🎖️ ${G.badges.length}</span>`;
}
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; d.style.top = (18 + document.querySelectorAll('.toast').length * 54) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function boom() { for (let i = 0; i < 36; i++) { const s = document.createElement('span'); s.className = 'cf'; s.textContent = ['🎉', '⭐', '✨', '🔥', '🎊'][i % 5]; s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 3200); } }
function beep(ok) { if (!snd) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = ok ? 'sine' : 'square'; o.frequency.value = ok ? 880 : 200; g.gain.value = .05; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? .12 : .2)); } catch (e) {} }
function add(n) { const r0 = rank(); G.xp += n; if (rank() > r0) { toast('⬆️ Lên hạng: ' + RANKS[rank()][1] + '!'); boom(); } }
function badge(k) { if (G.badges.includes(k)) return; G.badges.push(k); toast(`🎖️ Huy hiệu mới: ${BG[k][0]} ${BG[k][1]}`); boom(); }
function gain(ok, x) {
  const a = $('#app'), cb = $('#cb');
  if (ok) { combo++; G.best = Math.max(G.best, combo); G.ok++; if (x && x.id && x.id[1] === 't') G.trap++; add(10 + Math.min(combo - 1, 5) * 2); }
  else combo = 0;
  G.tdN++; if (G.tdN === 20) { toast('🎯 Hoàn thành chỉ tiêu hôm nay! +20 XP'); add(20); badge('goal'); }
  if (G.ok >= 1) badge('first'); if (combo >= 5) badge('c5'); if (combo >= 10) badge('c10'); if (G.ok >= 50) badge('o50'); if (G.trap >= 10) badge('trap');
  beep(ok); a.classList.remove('pop', 'shake'); void a.offsetWidth; a.classList.add(ok ? 'pop' : 'shake');
  if (ok && combo >= 3) { cb.textContent = '🔥 Chuỗi ' + combo; cb.style.display = 'block'; } else cb.style.display = 'none';
  save(); xpDraw();
}
function finish(p) { if (p === 100) { badge('perf'); add(30); boom(); } else if (p >= 70) add(10); $('#cb').style.display = 'none'; combo = 0; save(); xpDraw(); }
function profile() {
  const r = rank(), nx = RANKS[r + 1];
  $('#app').innerHTML = `<div class="res"><div class="big">${RANKS[r][1]}</div><p><b>${G.xp} XP</b>${nx ? ` • còn ${nx[0] - G.xp} XP để lên ${nx[1]}` : ' • Cấp cao nhất!'}<br>🔥 ${G.days} ngày liên tiếp • Chuỗi đúng kỷ lục: ${G.best} • Tổng ${G.ok} câu đúng</p></div><div class="h4">Huy hiệu (${G.badges.length}/${Object.keys(BG).length})</div><div class="bg">${Object.keys(BG).map(k => `<div class="${G.badges.includes(k) ? '' : 'lk'}"><b>${BG[k][0]}</b>${BG[k][1]}<br><small>${BG[k][2]}</small></div>`).join('')}</div><div class="act"><button data-p="reset">Xóa tiến trình</button></div>`;
}
$('#app').addEventListener('click', e => { if (e.target.dataset.p && confirm('Xóa XP, huy hiệu và chuỗi ngày?')) { G = { ...DG, last: today(), days: 1 }; save(); xpDraw(); profile(); } });
$('#sn').onclick = () => { snd = !snd; $('#sn').textContent = snd ? '🔊' : '🔇'; };
xpDraw();
setTab(); start();
</script>
